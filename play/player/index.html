<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Play the original PlayStation build of Dungeon Complete in your browser.">
  <title>Dungeon Complete — Epok Engine</title>
  <style>
    html, body, #main, #game { width: 100%; height: 100%; margin: 0; background: #0b0d0e; color: white; }
    #game > p, #game noscript { display: block; padding: 1rem; font: 1rem system-ui; }
  </style>
  <script type="module">
    import { loadPlayer } from '../player.js';
    loadPlayer(document.getElementById('game'), () => {});
  </script>
</head>
<body>
  <main id="main">
    <div id="game"><p class="player-loading" role="status">Loading Dungeon Complete…</p><noscript>Enable JavaScript to run the PlayStation emulator.</noscript></div>
  </main>
</body>
</html>
